<body>
<!-- APP:START -->
<header class="top">
  <a class="brand" id="brand" data-go="home" href="/" aria-label="Home"><img class="mark" src="/img/mcl-32.png" alt="" width="30" height="30"><span class="logo" id="logo">MCL</span><span class="ver" id="ver">v1.0</span></a>
  <nav id="nav"></nav>
  <div class="topright">
    <button class="icb" id="themebtn" title="Switch theme" aria-label="Switch theme"></button>
    <a class="cta ghostcta" id="mebtn" data-go="me" href="#" hidden></a>
    <a class="cta discord" id="joinbtn" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24"><path d="M20.3 4.5A18 18 0 0 0 15.9 3l-.3.5a13 13 0 0 1 3.9 1.9 12.6 12.6 0 0 0-11 0A13 13 0 0 1 12.4 3.5L12.1 3a18 18 0 0 0-4.4 1.5C4.9 8.6 4.1 12.6 4.5 16.6a18 18 0 0 0 5.4 2.7l.7-1.2a11.6 11.6 0 0 1-1.8-.9l.4-.3a12.9 12.9 0 0 0 11 0l.4.3a11.6 11.6 0 0 1-1.8.9l.7 1.2a18 18 0 0 0 5.4-2.7c.5-4.7-.8-8.6-2.6-12.1ZM9.7 14.3c-1 0-1.9-1-1.9-2.2S8.6 9.9 9.7 9.9s1.9 1 1.9 2.2-.8 2.2-1.9 2.2Zm4.6 0c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2Z"/></svg><span>Discord</span></a>
    <button class="cta" data-go="submit">Submit Record</button>
  </div>
</header>
<!-- The backdrop: moon, crystal spikes and the ground under them, drawn by js/scenery.js. Purely visual. -->
<div class="scenery" aria-hidden="true"></div>
<div id="app"></div>
<footer>
  <span id="foot-left"></span>
  <span class="acts"><button class="btn ghost sm" id="adminbtn">Admin</button>
  <a class="pb" id="poweredby" href="#" target="_blank" rel="noopener"><i></i> Powered by Mucys-Studio.com</a></span>
</footer>

<!-- Netlify Forms: these two hidden forms let Netlify pick up submissions from the
     live site so they land in your Netlify dashboard as well as in the on-site queue.
     They do nothing when the site is opened from a file or from anywhere else. -->
<form name="mcl-record" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="player"><input type="text" name="challenge"><input type="text" name="percent">
  <input type="text" name="fps"><input type="text" name="device"><input type="text" name="clip"><input type="text" name="notes">
</form>
<form name="mcl-challenge" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="name"><input type="text" name="creator"><input type="text" name="verifier">
  <input type="text" name="basedOn"><input type="text" name="levelId"><input type="text" name="fps">
  <input type="text" name="top"><input type="text" name="video"><input type="text" name="by"><input type="text" name="notes"><input type="text" name="webcam">
</form>
<!-- APP:END -->
<script src="/js/scenery.js?v=39"></script>

</body>
</html>
